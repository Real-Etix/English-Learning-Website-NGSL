name: Vocabulary enrichment

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Enrichment stage to run
        required: true
        type: choice
        options: [ngsl, academic, business, toeic, fitness, advanced, all]
        default: ngsl
      limit:
        description: Maximum records to enrich
        required: true
        type: number
        default: 20
      max_input_tokens:
        description: Maximum LLM input tokens for the batch
        required: true
        type: number
        default: 10000
      max_output_tokens:
        description: Maximum LLM output tokens for the batch
        required: true
        type: number
        default: 5000
      dry_run:
        description: Validate the pipeline without opening a pull request
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      ENRICHMENT_STAGE: ${{ inputs.stage }}
      ENRICHMENT_LIMIT: ${{ inputs.limit }}
      ENRICHMENT_MAX_INPUT_TOKENS: ${{ inputs.max_input_tokens }}
      ENRICHMENT_MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
      ENRICHMENT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check enrichment secret
        if: inputs.dry_run == false
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [[ -z "$LLM_API_KEY" ]]; then
            echo "::error::LLM_API_KEY must be configured as a repository secret."
            exit 1
          fi

      - name: Capture base strict audit manifest
        run: npx tsx scripts/audit-dictionary.ts --json > "${RUNNER_TEMP}/dictionary-base-audit.json"

      - name: Capture base vocabulary lint report
        shell: bash
        run: |
          set -euo pipefail
          report_path="${RUNNER_TEMP}/vocabulary-base-lint.json"
          set +e
          npx tsx scripts/lint-vocabulary.ts --json > "$report_path"
          lint_exit_code=$?
          set -e
          npx tsx scripts/gate-vocabulary-lint.ts --validate="$report_path" --exit-code="$lint_exit_code"
          echo "VOCABULARY_BASE_LINT_REPORT=$report_path" >> "$GITHUB_ENV"
          echo "VOCABULARY_BASE_LINT_EXIT_CODE=$lint_exit_code" >> "$GITHUB_ENV"

      - name: Enrich canonical vocabulary
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          report_path="${RUNNER_TEMP}/vocabulary-enrichment-report.json"
          echo "ENRICHMENT_REPORT=$report_path" >> "$GITHUB_ENV"
          if [[ "$ENRICHMENT_DRY_RUN" == "true" ]]; then
            npm run enrich:vocabulary -- --stage="$ENRICHMENT_STAGE" --limit="$ENRICHMENT_LIMIT" --max-input-tokens="$ENRICHMENT_MAX_INPUT_TOKENS" --max-output-tokens="$ENRICHMENT_MAX_OUTPUT_TOKENS" --report="$report_path" --dry-run
          else
            npm run enrich:vocabulary -- --stage="$ENRICHMENT_STAGE" --limit="$ENRICHMENT_LIMIT" --max-input-tokens="$ENRICHMENT_MAX_INPUT_TOKENS" --max-output-tokens="$ENRICHMENT_MAX_OUTPUT_TOKENS" --report="$report_path"
          fi

      - name: Validate sanitized enrichment report
        run: npx tsx scripts/verify-enrichment-diff.ts --report="$ENRICHMENT_REPORT"

      - name: Upload enrichment report
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-enrichment-report
          path: ${{ runner.temp }}/vocabulary-enrichment-report.json
          if-no-files-found: error

      - name: Gate vocabulary lint regressions
        shell: bash
        run: |
          set -euo pipefail
          report_path="${RUNNER_TEMP}/vocabulary-current-lint.json"
          set +e
          npx tsx scripts/lint-vocabulary.ts --json > "$report_path"
          lint_exit_code=$?
          set -e
          npx tsx scripts/gate-vocabulary-lint.ts \
            --base="$VOCABULARY_BASE_LINT_REPORT" \
            --current="$report_path" \
            --base-exit-code="$VOCABULARY_BASE_LINT_EXIT_CODE" \
            --current-exit-code="$lint_exit_code"

      - name: Audit dictionary
        run: npm run audit:dictionary

      - name: Gate strict audit regressions against base manifest
        run: npm run audit:dictionary -- --strict --base-manifest="${RUNNER_TEMP}/dictionary-base-audit.json"

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint application
        run: npm run lint

      - name: Build generated graph artifacts
        run: npm run build:graphs

      - name: Production build
        run: npm run build

      - name: Validate generated diff
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          diff_file="${RUNNER_TEMP}/enrichment-diff.txt"
          {
            git diff --name-status --no-renames
            git ls-files --others --exclude-standard | sed $'s/^/A\t/'
          } > "$diff_file"
          if [[ ! -s "$diff_file" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx tsx scripts/verify-enrichment-diff.ts < "$diff_file"
          paths_file="${RUNNER_TEMP}/enrichment-paths.txt"
          cut -f2- "$diff_file" > "$paths_file"
          echo "paths_file=$paths_file" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create enrichment pull request
        if: inputs.dry_run == false && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths_file="${{ steps.diff.outputs.paths_file }}"
          branch="automation/vocabulary-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add --pathspec-from-file="$paths_file"
          git commit -m "content: enrich $ENRICHMENT_STAGE vocabulary"
          git push --set-upstream origin "$branch"
          report_summary="$(jq -r '\"Factual imports: \\(.factualImports)\\nReview proposals: \\(.reviewProposals)\\nHidden records: \\(.hiddenRecords)\\nRejections: \\(.rejections)\\nUnknown target suggestions: \\(.unknownTargets)\\nToken use: input \\(.tokenUsage.inputTokens), output \\(.tokenUsage.outputTokens)\\nEstimated remaining debt: \\(.estimatedRemainingDebt)\"' "$ENRICHMENT_REPORT")"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "content: enrich $ENRICHMENT_STAGE vocabulary" \
            --body "Automated vocabulary enrichment from GitHub Actions run ${GITHUB_RUN_ID}.

          ${report_summary}" \
            --label content \
            --label automated-enrichment
